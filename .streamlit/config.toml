# Açık, göz yormayan tema (kırık beyaz zemin, yumuşak gri kartlar)
[theme]
base = "light"
primaryColor = "#2f6fbf"
backgroundColor = "#f4f5f2"
secondaryBackgroundColor = "#e9ecef"
textColor = "#2b3340"
borderColor = "#d9dde3"
dataframeBorderColor = "#e1e4e8"
dataframeHeaderBackgroundColor = "#eef0f3"
showWidgetBorder = true
baseRadius = "10px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
metricValueFontWeight = 700
chartCategoricalColors = ["#257de0", "#f47230", "#00b894", "#f2a600", "#ee7fac", "#008a17", "#6a4ce2", "#ec4647"]

[client]
toolbarMode = "minimal"
